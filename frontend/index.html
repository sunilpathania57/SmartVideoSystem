<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Video Management System</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            Smart Video Management System
        </h1>

        <p>
            Camera Dashboard
        </p>

    </header>



    <main>


        <!-- =================================================
             LIVE CAMERA VIEW
        ================================================== -->

        <section class="card">

            <h2 id="liveCameraTitle">
                Live Camera View
            </h2>


            <div class="video-container">

                <img
                    id="liveVideo"
                    alt="Live camera video"
                    style="display: none;"
                >


                <p id="videoMessage">

                    Select a camera and click
                    "View Live".

                </p>

            </div>

        </section>




        <!-- =================================================
             ADD CAMERA
        ================================================== -->

        <section class="card">

            <h2>
                Add Camera
            </h2>


            <form id="cameraForm">


                <!-- Camera Name -->

                <input
                    type="text"
                    id="name"
                    placeholder="Camera Name"
                    required
                    autocomplete="off"
                >


                <!-- IP Address -->

                <input
                    type="text"
                    id="ip_address"
                    placeholder="IP Address"
                    autocomplete="off"
                >


                <!-- Camera Type -->

                <select id="camera_type">

                    <option value="IP">
                        IP Camera
                    </option>

                    <option value="USB">
                        USB Camera
                    </option>

                    <option value="NORMAL">
                        Normal Camera
                    </option>

                </select>


                <!-- Device Index -->

                <input
                    type="number"
                    id="device_index"
                    placeholder="Device Index"
                    value="0"
                    min="0"
                >


                <!-- Location -->

                <input
                    type="text"
                    id="location"
                    placeholder="Location"
                    autocomplete="off"
                >


                <!-- Username -->

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                >


                <!-- Password -->

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >


                <!-- RTSP URL -->

                <input
                    type="text"
                    id="rtsp_url"
                    placeholder="RTSP URL"
                    autocomplete="off"
                >


                <!-- Status -->

                <select id="status">

                    <option value="online">
                        Online
                    </option>

                    <option value="offline">
                        Offline
                    </option>

                </select>


                <!-- Add Camera -->

                <button
                    type="submit"
                >
                    Add Camera
                </button>


            </form>

        </section>



        <!-- =================================================
             CAMERA LIST
        ================================================== -->

        <section class="card">

            <h2>
                Camera Monitoring
            </h2>

            <div
                class="camera-grid"
                id="cameraList"
            >
                <p>
                    Loading cameras...
                </p>
            </div>

        </section>



        <!-- =================================================
             RECORDING HISTORY
        ================================================== -->

        <section class="card">

            <h2>
                Recording History
            </h2>

            <div class="recording-filters">

                <input
                    type="text"
                    id="recordingSearch"
                    placeholder="Search filename..."
                >

                <input
                    type="number"
                    id="recordingCameraFilter"
                    placeholder="Camera ID"
                    min="1"
                >

                <select id="recordingStatusFilter">

                    <option value="">
                        All Status
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="recording">
                        Recording
                    </option>

                    <option value="failed">
                        Failed
                    </option>

                </select>

                <button
                    type="button"
                    id="clearRecordingFilters"
                >
                    Clear Filters
                </button>

            </div>

            <div id="recordingList">

                <p>
                    Loading recordings...
                </p>

            </div>

        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="/static/app.js"
    ></script>


</body>

</html>
